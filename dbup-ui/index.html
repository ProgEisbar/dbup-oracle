<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBUP DDL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Splash instantáneo: evita una pantalla vacía mientras carga React. -->
      <div id="pre-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#0d1229 0%,#1a2040 50%,#0d1229 100%)">
        <div style="display:flex;align-items:center;gap:12px" role="img" aria-label="DBUP DDL">
          <div style="display:flex;width:52px;height:52px;align-items:center;justify-content:center;border:1px solid #0de6b4;border-radius:12px;color:#0de6b4;font-family:monospace;font-weight:800">DB</div>
          <div style="color:#fff;font-family:Montserrat,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:.08em">DBUP DDL</div>
        </div>
        <div style="width:24px;height:24px;border:2px solid #2a3260;border-top-color:#0de6b4;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <p style="color:#7b85b0;font-family:Lato,sans-serif;font-size:13px;margin:0">Cargando...</p>
      </div>
      <style>#pre-splash{transition:opacity .2s}@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
