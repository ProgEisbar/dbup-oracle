stages:
  - build_image
  - validate
  - distribute
  - dev
  - promote

variables:
  DBUP_SQLCL_IMAGE: "{DBUP_SQLCL_IMAGE}"
  DBUP_SQL_CMD: "sql"
  DBUP_DDL_DIR: "dbup/ddl"
  DBUP_LOG_DIR: "dbup/logs"
  DBUP_ENTITY: "700"
  DBUP_TEMPLATE_DIR: "templates/dev"
  DBUP_DISTRIBUTE_ENTITIES: "700 701 702 703"
  DBUP_ECR_REPO_NAME: "{DBUP_ECR_REPOSITORY}"
  DBUP_ECR_IMAGE_TAG: "latest"

default:
  image: "$DBUP_SQLCL_IMAGE"
  tags:
    - {DBUP_RUNNER_TAG}
  before_script:
    - mkdir -p "$DBUP_LOG_DIR"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dbup/logs/

build:sqlcl-image:
  stage: build_image
  image: docker:latest
  services:
    - docker:dind
  allow_failure: true
  tags:
    - {DBUP_RUNNER_TAG}
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache aws-cli
  script:
    - export ECR_REGION="${DEV_AWS_REGION}"
    - aws sts get-caller-identity
    - aws ecr-public get-login-password --region "$ECR_REGION" | docker login --username AWS --password-stdin public.ecr.aws
    - aws ecr-public create-repository --repository-name "$DBUP_ECR_REPO_NAME" --region "$ECR_REGION" || true
    - export REPOSITORY_URI="$(aws ecr-public describe-repositories --region "$ECR_REGION" --query "repositories[?repositoryName=='$DBUP_ECR_REPO_NAME'].repositoryUri | [0]" --output text)"
    - export IMAGE_URI="${REPOSITORY_URI}:${DBUP_ECR_IMAGE_TAG}"
    - docker build -t "$DBUP_ECR_REPO_NAME:$DBUP_ECR_IMAGE_TAG" Docker
    - docker tag "$DBUP_ECR_REPO_NAME:$DBUP_ECR_IMAGE_TAG" "$IMAGE_URI"
    - docker push "$IMAGE_URI"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Docker/**/*
      when: manual

validate:ddl:
  stage: validate
  script:
    - java -version
    - "$DBUP_SQL_CMD -v"
    - bash ci/validate-ddl.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

distribute:dev:
  stage: distribute
  image: alpine:latest
  tags:
    - {DBUP_RUNNER_TAG}
  before_script: []
  artifacts: {}
  script:
    - apk add --no-cache bash git
    - bash ci/distribute-templates.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - templates/dev/**/*
      when: manual

.deploy_template:
  script:
    - bash ci/run-ddl.sh "$DBUP_ENVIRONMENT"
  resource_group: "dbup-$DBUP_ENVIRONMENT"
  needs:
    - job: validate:ddl

deploy:dev:
  extends: .deploy_template
  stage: dev
  variables:
    DBUP_ENVIRONMENT: "DEV"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - dbup/ddl/**/*
      when: manual

promote:qa:
  stage: promote
  image: alpine:latest
  tags:
    - {DBUP_RUNNER_TAG}
  needs:
    - job: validate:ddl
    - job: deploy:dev
  before_script: []
  artifacts: {}
  variables:
    GIT_STRATEGY: fetch
  script:
    - apk add --no-cache git
    - test -n "$DBUP_QA_REPO_URL"
    - test -n "$DBUP_QA_REPO_TOKEN"
    - export QA_AUTH_URL="https://oauth2:${DBUP_QA_REPO_TOKEN}@${DBUP_QA_REPO_URL#https://}"
    - git clone "$QA_AUTH_URL" qa-repo
    - mkdir -p qa-repo/dbup/ddl/shared/ENTIDAD700 qa-repo/dbup/ddl/qa/ENTIDAD700 qa-repo/dbup/ddl/qa/PARAM700
    - cp -R dbup/ddl/shared/. qa-repo/dbup/ddl/shared/
    - if [ -d dbup/ddl/qa ]; then cp -R dbup/ddl/qa/. qa-repo/dbup/ddl/qa/; fi
    - cd qa-repo
    - git config user.name "DBUP GitLab"
    - git config user.email "dbup-bot@example.invalid"
    - git add dbup/ddl
    - git commit -m "Promover DDL desde DEV ${CI_COMMIT_SHORT_SHA}" || echo "No changes to promote"
    - git push origin main
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - dbup/ddl/**/*
      when: manual
