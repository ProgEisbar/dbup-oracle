stages:
  - build

build_sqlcl_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - {DBUP_RUNNER_TAG}
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DBUP_ECR_REPO_NAME: "{DBUP_ECR_REPOSITORY}"
    DBUP_ECR_IMAGE_TAG: "latest"
  before_script:
    - apk add --no-cache aws-cli
  script:
    - 'export ECR_REGION="${DEV_AWS_REGION}"'
    - 'aws sts get-caller-identity'
    - 'aws ecr-public get-login-password --region "$ECR_REGION" | docker login --username AWS --password-stdin public.ecr.aws'

    - 'aws ecr-public create-repository --repository-name "$DBUP_ECR_REPO_NAME" --region "$ECR_REGION" || true'

    - 'export REPOSITORY_URI="$(aws ecr-public describe-repositories --region "$ECR_REGION" --query "repositories[?repositoryName==''$DBUP_ECR_REPO_NAME''].repositoryUri | [0]" --output text)"'
    - 'export IMAGE_URI="${REPOSITORY_URI}:${DBUP_ECR_IMAGE_TAG}"'

    - 'echo "Repository URI: $REPOSITORY_URI"'
    - 'echo "Image URI: $IMAGE_URI"'

    - 'docker build -t "$DBUP_ECR_REPO_NAME:$DBUP_ECR_IMAGE_TAG" Docker'
    - 'docker tag "$DBUP_ECR_REPO_NAME:$DBUP_ECR_IMAGE_TAG" "$IMAGE_URI"'
    - 'docker push "$IMAGE_URI"'

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
